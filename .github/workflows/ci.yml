name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  install-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: install-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc -b frontend/tsconfig.json --noEmit
        continue-on-error: false
      - run: npm run build -w database
      - run: npx tsc -p backend/tsconfig.json --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    needs: install-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test -w backend
      - run: npm run test -w frontend

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parts_inventory
          POSTGRES_PASSWORD: parts_inventory_test_password
          POSTGRES_DB: parts_inventory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parts_inventory -d parts_inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://parts_inventory:parts_inventory_test_password@localhost:5432/parts_inventory_test?schema=public
      DIRECT_URL: postgresql://parts_inventory:parts_inventory_test_password@localhost:5432/parts_inventory_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-change-me-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-me-32chars
      COOKIE_SECRET: ci-cookie-secret-please-change-me-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test -w backend

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: parts_inventory-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: parts_inventory-frontend:ci

  # Deployment only runs after every check above succeeds, and only from main.
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - run: echo "Wire this job to your target (ECS/App Runner/etc.) — see docs/deployment.md. No deploy credentials are configured in this template."
