server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No /api/ reverse proxy here on purpose: VITE_API_URL is baked into the
    # JS bundle as an absolute URL at build time (see docker-compose.yml and
    # frontend/Dockerfile's VITE_API_URL build arg), so the browser calls the
    # backend directly. An nginx proxy_pass to a same-network "backend"
    # hostname works under docker-compose but hard-crashes nginx at startup
    # anywhere that hostname doesn't resolve (e.g. Railway's split services,
    # where frontend and backend are unrelated deployments) — nginx
    # validates static proxy_pass upstreams at config-load time, so a
    # temporarily-unresolvable one takes the whole container down, not just
    # that route.

    # SPA fallback — client-side routing. index.html itself must never be
    # cached: it's the only unhashed file in the build, and it's what
    # references the content-hashed /assets/ bundle. Without an explicit
    # no-cache header here, a client (browser or, worse, an Android WebView
    # with a stickier HTTP cache) can keep serving an old index.html
    # indefinitely, which points at JS/CSS that no longer exists after a
    # redeploy — every future release would look like it "didn't take".
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
